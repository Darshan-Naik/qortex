name: Publish Qortex Packages

on:
  push:
    branches:
      - main
    paths:
      - "packages/**/package.json"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    if: github.repository == 'Darshan-Naik/qortex'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test:packages

      - name: Build Packages
        run: pnpm build:packages

      - name: Publish to NPM
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 1. Configure the token in the global npm config for the runner
          npm config set //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          
          # 2. Iterate and publish each package manually to ensure context
          for pkg in query query-react db store store-react; do
            echo "Publishing qortex-$pkg..."
            cd packages/$pkg/dist
            npm publish --access public --no-git-checks
            cd ../../../
          done