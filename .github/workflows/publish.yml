name: Publish Qortex Packages

on:
  push:
    branches:
      - main
    paths:
      - "packages/**/package.json"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    if: github.repository == 'Darshan-Naik/qortex'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test:packages

      - name: Build Packages
        run: pnpm build:packages

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 1. Check if the token is available
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Error: secrets.NPM_TOKEN is missing. Please add it to your GitHub Repository Secrets."
            exit 1
          fi
          
          # 2. Prepare publishable dist folders (creates dist/package.json)
          pnpm prepare:publish
          
          # 3. Publish only packages with a new version
          echo "Checking all packages for version changes..."
          
          for dir in packages/*; do
            if [ -d "$dir/dist" ] && [ -f "$dir/dist/package.json" ]; then
              PKG_NAME=$(jq -r .name "$dir/dist/package.json")
              PKG_VERSION=$(jq -r .version "$dir/dist/package.json")
              
              echo "Checking $PKG_NAME@$PKG_VERSION..."
              
              if npm view "$PKG_NAME@$PKG_VERSION" version > /dev/null 2>&1; then
                echo "  $PKG_NAME@$PKG_VERSION is already on NPM. Skipping."
              else
                echo "  $PKG_NAME@$PKG_VERSION is new. Publishing..."
                (cd "$dir/dist" && npm publish --access public)
              fi
            fi
          done